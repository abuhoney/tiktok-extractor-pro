name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Copy APK to release name
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/tiktok-extractor-pro.apk

      - name: Extract version
        id: version
        working-directory: android
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed -E 's/.*versionName\s+"([^"]+)".*/\1/')
          CODE=$(grep 'versionCode' app/build.gradle | head -1 | sed -E 's/.*versionCode\s+([0-9]+).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "APK version: $VERSION (code: $CODE)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-extractor-pro-v${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/tiktok-extractor-pro.apk
          retention-days: 90

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TikTok Extractor Pro v${{ steps.version.outputs.version }}
          body: |
            # TikTok Extractor Pro v${{ steps.version.outputs.version }}

            ## التحميل
            حمّل ملف `tiktok-extractor-pro.apk` وثبّته على هاتفك.

            ## الميزات
            - 3 أزرار عائمة (FAB):
              - 🔵 **قاعدة البيانات** (سيان): مراقبة المستخدمين المحفوظين
              - 🟠 **تسجيل الدخول** (برتقالي): يفتح WebView لتسجيل دخول TikTok
              - 🔴 **فتح في TikTok** (وردي): يفتح الرابط في TikTok/Chrome للتفاعل اليدوي
            - ضغطة طويلة على 🔴: استخراج عميق (يحفظ page.html + webmssdk.js + JSON)
            - التقاط تلقائي لـ sessionid بعد تسجيل الدخول اليدوي
            - v5.0: نقاط API جديدة (/api/deep/*, /api/stats/*)
          files: android/app/build/outputs/apk/tiktok-extractor-pro.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
