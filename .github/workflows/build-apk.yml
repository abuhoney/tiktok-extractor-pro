name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Sign APK (if keystore present)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          # If no keystore secrets provided, use the debug-signed APK
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secrets provided — using debug-signed APK"
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/tiktok-extractor-pro.apk
            exit 0
          fi
          # Decode keystore
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          # Sign the APK
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/tiktok-extractor-pro-aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks /tmp/keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app/build/outputs/apk/tiktok-extractor-pro.apk \
            app/build/outputs/apk/tiktok-extractor-pro-aligned.apk
          rm /tmp/keystore.jks

      - name: Extract version
        id: version
        working-directory: android
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed -E 's/.*versionName\s+"([^"]+)".*/\1/')
          CODE=$(grep 'versionCode' app/build.gradle | head -1 | sed -E 's/.*versionCode\s+([0-9]+).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "APK version: $VERSION (code: $CODE)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-extractor-pro-v${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/tiktok-extractor-pro.apk
          retention-days: 90

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TikTok Extractor Pro v${{ steps.version.outputs.version }}
          body: |
            # TikTok Extractor Pro v${{ steps.version.outputs.version }}

            ## التحميل
            حمّل ملف `tiktok-extractor-pro.apk` وثبّته على هاتفك.

            ## الميزات الجديدة
            - 3 أزرار عائمة (FAB):
              - 🔵 **قاعدة البيانات** (سيان): مراقبة المستخدمين المحفوظين
              - 🟠 **تسجيل الدخول** (برتقالي): يفتح WebView لتسجيل دخول TikTok
              - 🔴 **استخراج** (وردي): استخراج سريع للرابط الحالي
            - التقاط تلقائي لـ sessionid + جميع الكوكيز بعد تسجيل الدخول اليدوي
            - حفظ الجلسة في GitHub أو محلياً مع رابط تنزيل
            - 6 معالجات تحليل عميق (top_fans, stream_quality, linkmic, ttwid, conversion, badges)
            - نقاط API جديدة: /api/session/capture, /api/v47-analytics

            ## كيفية تسجيل الدخول
            1. اضغط زر 🟠 البرتقالي في التطبيق
            2. سجّل دخولك إلى TikTok بنفسك
            3. سيُلتقط sessionid تلقائياً ويُحفظ
          files: android/app/build/outputs/apk/tiktok-extractor-pro.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
