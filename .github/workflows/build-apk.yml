name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/tiktok-extractor-pro.apk
      - name: Version
        id: v
        working-directory: android
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed -E 's/.*versionName\s+"([^"]+)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: apk-v${{ steps.v.outputs.version }}
          path: android/app/build/outputs/apk/tiktok-extractor-pro.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: TikTok Extractor Pro v${{ steps.v.outputs.version }}
          files: android/app/build/outputs/apk/tiktok-extractor-pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
