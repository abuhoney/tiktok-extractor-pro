name: Build Android APK (TWA)

# ============================================================
# TikTok Extractor Pro v3.0 — Build APK via Gradle directly
# Uses the pre-built Android project in /android
# ============================================================

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

env:
  SERVICE_URL: https://tiktok-extractor-pro.onrender.com
  PACKAGE_ID: com.tiktok.extractor
  APP_NAME: TikTok Extractor Pro

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      # ─── 1) Checkout ────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ─── 2) JDK 17 ─────────────────────────────────────────────────────
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ─── 3) Android SDK ────────────────────────────────────────────────
      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0'

      # ─── 4) Decode keystore ─────────────────────────────────────────────
      - name: 🔑 Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p $HOME/.android
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "⚠️  ANDROID_KEYSTORE_BASE64 not set — generating ephemeral keystore"
            keytool -genkey -v \
              -keystore $HOME/.android/debug.keystore \
              -alias android \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=TikTok Extractor Pro, OU=Dev, O=abuhoney, L=Dubai, ST=Dubai, C=AE"
            echo "KEYSTORE_PATH=$HOME/.android/debug.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > $HOME/.android/release.keystore
            echo "KEYSTORE_PATH=$HOME/.android/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || 'android' }}" >> $GITHUB_ENV
            echo "✅ Keystore decoded from secret ($(wc -c < $HOME/.android/release.keystore) bytes)"
          fi

      # ─── 5) Generate Gradle wrapper (if not already present) ───────────
      - name: 🔧 Set up Gradle wrapper
        working-directory: ./android
        run: |
          # Install Gradle 8.7
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found — installing gradle 8.7"
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/
            /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew
          ./gradlew --version

      # ─── 6) Configure signing config in build.gradle ───────────────────
      - name: 🔐 Configure signing
        working-directory: ./android
        run: |
          # Inject signing config into app/build.gradle
          python3 - <<'EOF'
          import re
          with open('app/build.gradle', 'r') as f:
              content = f.read()
          # Add signing config inside android { ... }
          signing_config = '''
          signingConfigs {
              release {
                  storeFile file(System.env.KEYSTORE_PATH)
                  storePassword System.env.KEYSTORE_PASSWORD
                  keyAlias 'android'
                  keyPassword System.env.KEYSTORE_PASSWORD
              }
          }
          '''
          # Insert after the android { line
          content = re.sub(r'(android\s*\{)', r'\1\n' + signing_config, content, count=1)
          # Add signingConfig to release buildType
          content = re.sub(
              r'(buildTypes\s*\{\s*release\s*\{)',
              r'\1\n            signingConfig signingConfigs.release',
              content
          )
          with open('app/build.gradle', 'w') as f:
              f.write(content)
          print("✅ Signing config injected into app/build.gradle")
          EOF
          echo
          echo "--- app/build.gradle (preview) ---"
          head -50 app/build.gradle

      # ─── 7) Build APK ──────────────────────────────────────────────────
      - name: 🔨 Build APK
        working-directory: ./android
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ../output
          # Build the release APK
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -80
          # Locate APK
          APK_PATH=$(find . -name "*.apk" -path "*/release/*" | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -1)
          fi
          if [ -n "$APK_PATH" ]; then
            echo "✅ APK built: $APK_PATH"
            cp "$APK_PATH" ../output/tiktok-extractor-pro.apk
            ls -la ../output/
          else
            echo "❌ No APK found in build output"
            find . -name "*.apk"
            exit 1
          fi

      # ─── 8) Get signing cert SHA-256 ───────────────────────────────────
      - name: 🔍 Get signing cert SHA-256
        env:
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
        run: |
          SHA=$(keytool -list -v -keystore "$KEYSTORE_PATH" \
                  -alias android -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
                  | grep -i "SHA256:" | head -1 | awk -F: '{print $2}' | tr -d ' ')
          echo "APK_SIGNING_SHA256=$SHA" >> $GITHUB_ENV
          echo "::notice::SHA-256 of APK signing cert: $SHA"

      # ─── 9) Determine version ───────────────────────────────────────────
      - name: 📋 Determine version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      # ─── 10) Upload APK ─────────────────────────────────────────────────
      - name: 📦 Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TikTok Extractor Pro v${{ env.VERSION }}
          body: |
            # TikTok Extractor Pro v${{ env.VERSION }}

            ## 📲 Installation

            1. Download `tiktok-extractor-pro.apk` below
            2. Enable "Install unknown apps" in Android settings
            3. Tap the APK to install
            4. Open the app — loads the PWA at ${{ env.SERVICE_URL }}

            ## 🔗 Deep-link Setup (optional)

            To enable deep links, set on Render:
            ```
            APK_SIGNING_SHA256=${{ env.APK_SIGNING_SHA256 }}
            ```

            ## 🔐 Signing Info

            - Package ID: `${{ env.PACKAGE_ID }}`
            - Signing SHA-256: `${{ env.APK_SIGNING_SHA256 }}`
            - Built from commit: ${{ github.sha }}
            - Built on: ${{ github.run_id }}

          files: |
            output/tiktok-extractor-pro.apk
          draft: false
          prerelease: false

      # ─── 11) Summary ───────────────────────────────────────────────────
      - name: ✅ Summary
        run: |
          echo "=============================================="
          echo "  APK build complete!"
          echo "=============================================="
          echo "Service URL:    $SERVICE_URL"
          echo "APK file:       output/tiktok-extractor-pro.apk"
          echo "SHA-256:        $APK_SIGNING_SHA256"
          echo "Version:        $VERSION"
          echo ""
          echo "Download at:"
          echo "  https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
