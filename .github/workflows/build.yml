name: Build Android APK

on:
  push:
    branches:
      - main
      - 'apk-build/**'
    paths:
      - 'android/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Detect Android project
        id: detect
        run: |
          # Check if this is an uploaded project (apk-build branch) or BardomPro itself
          if [[ "${{ github.ref_name }}" == apk-build/* ]]; then
            echo "project_type=uploaded" >> $GITHUB_OUTPUT
          else
            echo "project_type=bardompro" >> $GITHUB_OUTPUT
          fi
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          # List the android directory contents for debugging
          echo "=== Android directory contents ==="
          ls -la android/ 2>/dev/null || echo "No android/ directory found"

      - name: Create release keystore
        run: |
          cd android/app
          if [ ! -f release.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore release.keystore \
              -alias bardom-release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 9125 \
              -storepass bardom_release_2026 \
              -keypass bardom_release_2026 \
              -dname "CN=BardomPro, OU=APK Builder, O=Bardom, L=Riyadh, ST=Riyadh Province, C=SA"
          fi

      - name: Ensure Gradle wrapper exists
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Ensure local.properties
        run: |
          cd android
          if [ ! -f local.properties ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          fi

      - name: Ensure signing config in build.gradle
        run: |
          cd android/app
          BUILD_FILE="build.gradle"
          if [ -f "build.gradle.kts" ]; then BUILD_FILE="build.gradle.kts"; fi
          
          if ! grep -q "signingConfigs" "$BUILD_FILE"; then
            echo "Adding signing config to $BUILD_FILE"
            if [[ "$BUILD_FILE" == *.kts ]]; then
              # Kotlin DSL
              sed -i '/android {/a\    signingConfigs {\n        create("release") {\n            storeFile = file("release.keystore")\n            storePassword = "bardom_release_2026"\n            keyAlias = "bardom-release"\n            keyPassword = "bardom_release_2026"\n        }\n    }' "$BUILD_FILE"
              sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' "$BUILD_FILE"
            else
              # Groovy DSL
              sed -i '/android {/a\    signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword "bardom_release_2026"\n            keyAlias "bardom-release"\n            keyPassword "bardom_release_2026"\n        }\n    }' "$BUILD_FILE"
              sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' "$BUILD_FILE"
            fi
          fi

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE=release.keystore \
            -PMYAPP_UPLOAD_STORE_PASSWORD=bardom_release_2026 \
            -PMYAPP_UPLOAD_KEY_ALIAS=bardom-release \
            -PMYAPP_UPLOAD_KEY_PASSWORD=bardom_release_2026 \
            --no-daemon \
            --stacktrace 2>&1 | tee build-log.txt

      - name: Find APK
        id: find-apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" -type f | head -1)
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK built at: $APK_PATH"
          ls -la "$APK_PATH" || echo "APK not found!"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-APK
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-build-${{ github.run_number }}-${{ github.ref_name }}
          name: "APK Build #${{ github.run_number }} (${{ github.ref_name }})"
          body: |
            Automated APK build
            
            - Build: #${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - Project: ${{ steps.detect.outputs.project_type }}
          files: |
            ${{ steps.find-apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
