plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tiktok.extractor'
    compileSdk 34

    defaultConfig {
        applicationId "com.tiktok.extractor"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.0.11"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AppCompat — required for AppCompatActivity
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Material Design — required for FloatingActionButton (FAB)
    implementation 'com.google.android.material:material:1.11.0'
    // WebView is part of the Android SDK — no extra dependency needed
}
