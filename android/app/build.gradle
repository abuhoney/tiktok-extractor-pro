plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tiktok.extractor'
    compileSdk 34

    defaultConfig {
        applicationId "com.tiktok.extractor"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity — wraps the PWA into a native APK
    implementation 'androidx.browser:browser:1.8.0'
}
