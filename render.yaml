# render.yaml — Render deployment configuration (v1.0.39)
# Playwright is optional — build always succeeds even if Chromium install fails.

services:
  - type: web
    name: tiktok-extractor-pro
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && (playwright install chromium || true)
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 10000
      - key: ENABLE_PLAYWRIGHT
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/health
    autoDeploy: true
