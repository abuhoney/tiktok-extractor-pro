# render.yaml — Render deployment configuration (v1.0.36)
# Defines the service explicitly with REAL Playwright support.
#
# Note: --with-deps doesn't work on Render free tier because it requires
# sudo access for apt-get. Instead, we install the required system libraries
# manually via the buildCommand.

services:
  - type: web
    name: tiktok-extractor-pro
    env: python
    region: oregon
    plan: free
    # Flat structure — no rootDir needed
    buildCommand: |
      pip install -r requirements.txt &&
      playwright install chromium &&
      python -c "import requests; r=requests.get('https://sf16-website-login.neutral.ttwstatic.com/obj/tiktok_web_login_static/webmssdk/1.0.0.417/webmssdk.js',verify=False,timeout=30); open('webmssdk_remote.js','w').write(r.text); print(f'Pre-cached webmssdk.js ({len(r.text)} bytes)')"
    startCommand: python app.py
    # Environment variables (set from Render Dashboard for security)
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 10000
      - key: ENABLE_PLAYWRIGHT
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      # GH_TOKEN — set manually from Render Dashboard → Environment
      # TIKTOK_PROXY — set manually if needed for geo-unblocking
    healthCheckPath: /api/health
    autoDeploy: true
