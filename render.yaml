# render.yaml — Render deployment configuration (v1.0.38)
# Defines the service explicitly.
#
# Playwright is optional — if Chromium can't be installed on Render free tier,
# the code gracefully falls back to xbogus.py (Python port of X-Bogus algorithm).

services:
  - type: web
    name: tiktok-extractor-pro
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 10000
      - key: ENABLE_PLAYWRIGHT
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/health
    autoDeploy: true
