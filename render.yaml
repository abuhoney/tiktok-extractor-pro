# render.yaml — Render deployment configuration (v1.0.37)
# Defines the service explicitly with optional Playwright support.
#
# Note: Render free tier may not have all Chromium system deps.
# We install them manually via apt-get. If Playwright still fails,
# the code gracefully falls back to xbogus.py (Python port).
# Set ENABLE_PLAYWRIGHT=true to enable real webmssdk.js execution.

services:
  - type: web
    name: tiktok-extractor-pro
    env: python
    region: oregon
    plan: free
    # Flat structure — no rootDir needed
    buildCommand: |
      pip install -r requirements.txt &&
      (playwright install chromium 2>&1 || echo "Playwright Chromium install failed — will use xbogus.py fallback") &&
      (python -c "import requests; r=requests.get('https://sf16-website-login.neutral.ttwstatic.com/obj/tiktok_web_login_static/webmssdk/1.0.0.417/webmssdk.js',verify=False,timeout=30); open('webmssdk_remote.js','w').write(r.text); print(f'Pre-cached webmssdk.js ({len(r.text)} bytes)')" 2>&1 || echo "webmssdk.js pre-cache failed — will download at runtime")
    startCommand: python app.py
    # Environment variables (set from Render Dashboard for security)
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 10000
      - key: ENABLE_PLAYWRIGHT
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      # GH_TOKEN — set manually from Render Dashboard → Environment
      # TIKTOK_PROXY — set manually if needed for geo-unblocking
    healthCheckPath: /api/health
    autoDeploy: true
